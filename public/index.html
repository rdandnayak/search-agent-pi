<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Search Agent</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f5f5;
      --surface: #ffffff;
      --user-bg: #0071e3;
      --user-text: #ffffff;
      --agent-bg: #e9e9eb;
      --agent-text: #1a1a1a;
      --status-text: #888;
      --source-text: #0071e3;
      --border: #ddd;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    html, body { height: 100%; }

    body {
      font-family: var(--font);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      font-weight: 600;
      font-size: 1rem;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .row {
      display: flex;
      flex-direction: column;
      max-width: 75%;
    }
    .row.user  { align-self: flex-end; align-items: flex-end; }
    .row.agent { align-self: flex-start; }

    .bubble {
      padding: 0.6rem 0.9rem;
      border-radius: 1.1rem;
      font-size: 0.95rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Markdown rendered inside agent bubbles */
    .row.agent .bubble { white-space: normal; }
    .row.agent .bubble p        { margin: 0 0 0.5em; }
    .row.agent .bubble p:last-child { margin-bottom: 0; }
    .row.agent .bubble ul,
    .row.agent .bubble ol       { margin: 0.25em 0 0.5em 1.4em; }
    .row.agent .bubble li       { margin-bottom: 0.15em; }
    .row.agent .bubble strong   { font-weight: 600; }
    .row.agent .bubble em       { font-style: italic; }
    .row.agent .bubble code     { font-family: monospace; font-size: 0.88em;
                                  background: rgba(0,0,0,0.07); border-radius: 3px;
                                  padding: 0.1em 0.35em; }
    .row.agent .bubble pre      { background: rgba(0,0,0,0.07); border-radius: 6px;
                                  padding: 0.7em 0.9em; overflow-x: auto;
                                  margin: 0.4em 0; }
    .row.agent .bubble pre code { background: none; padding: 0; }
    .row.agent .bubble h1,
    .row.agent .bubble h2,
    .row.agent .bubble h3       { font-weight: 600; margin: 0.6em 0 0.3em; }
    .row.agent .bubble a        { color: var(--source-text); }
    .row.agent .bubble img      { max-width: 100%; border-radius: 6px; margin: 0.4em 0; display: block; }
    .row.user  .bubble { background: var(--user-bg); color: var(--user-text); border-bottom-right-radius: 0.3rem; }
    .row.agent .bubble { background: var(--agent-bg); color: var(--agent-text); border-bottom-left-radius: 0.3rem; }

    .status {
      font-size: 0.82rem;
      color: var(--status-text);
      font-style: italic;
      padding: 0.2rem 0.2rem;
    }

    .sources {
      margin-top: 0.4rem;
      font-size: 0.8rem;
    }
    .sources summary {
      color: var(--status-text);
      font-size: 0.78rem;
      cursor: pointer;
      list-style: none;
      display: inline-flex;
      align-items: center;
      gap: 0.3em;
      user-select: none;
    }
    .sources summary::-webkit-details-marker { display: none; }
    .sources summary::before {
      content: "›";
      display: inline-block;
      transition: transform 0.15s;
    }
    .sources[open] summary::before { transform: rotate(90deg); }
    .sources-list {
      margin-top: 0.35rem;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      padding-left: 0.8rem;
    }
    .sources-list a {
      color: var(--source-text);
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sources-list a:hover { text-decoration: underline; }

    /* blinking cursor while streaming */
    .cursor::after {
      content: "▍";
      animation: blink 0.8s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    #form {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 0.75rem 1rem;
      display: flex;
      gap: 0.5rem;
    }

    #input {
      flex: 1;
      padding: 0.6rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      font-size: 0.95rem;
      font-family: var(--font);
      outline: none;
    }
    #input:focus { border-color: var(--user-bg); }

    #send {
      padding: 0.6rem 1.2rem;
      background: var(--user-bg);
      color: #fff;
      border: none;
      border-radius: 1.5rem;
      font-size: 0.95rem;
      cursor: pointer;
    }
    #send:disabled { opacity: 0.5; cursor: default; }

    #mic {
      padding: 0.6rem 0.75rem;
      background: #e9e9eb;
      color: #333;
      border: none;
      border-radius: 1.5rem;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    #mic:hover  { background: #d1d1d6; }
    #mic.recording {
      background: #ff3b30;
      color: #fff;
      animation: pulse 1s ease-in-out infinite;
    }
    #mic:disabled { opacity: 0.5; cursor: default; animation: none; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
  </style>
</head>
<body>
  <header>Search Agent</header>
  <div id="messages"></div>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="Ask anything…" />
    <button id="mic"  type="button" title="Click to record voice input">🎤</button>
    <button id="send" type="submit">Send</button>
  </form>

  <script>
    marked.use({ breaks: true }); // treat single newlines as <br>

    const messagesEl = document.getElementById("messages");
    const form       = document.getElementById("form");
    const input      = document.getElementById("input");
    const sendBtn    = document.getElementById("send");

    // Client-owned conversation history — sent in full with every request.
    const history = [];

    function addRow(role) {
      const row = document.createElement("div");
      row.className = `row ${role}`;
      messagesEl.appendChild(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return row;
    }

    function addBubble(row, text) {
      const b = document.createElement("div");
      b.className = "bubble";
      b.textContent = text;
      row.appendChild(b);
      return b;
    }

    // The status line sits above the agent bubble and updates in place.
    function addStatus(row) {
      const s = document.createElement("div");
      s.className = "status";
      row.prepend(s);
      return s;
    }

    function addSources(row, sources) {
      if (!sources.length) return;
      const seen   = new Set();
      const unique = sources.filter(s => !seen.has(s.url) && seen.add(s.url));
      if (!unique.length) return;

      const details = document.createElement("details");
      details.className = "sources";

      const summary = document.createElement("summary");
      summary.textContent = `${unique.length} source${unique.length !== 1 ? "s" : ""}`;
      details.appendChild(summary);

      const list = document.createElement("div");
      list.className = "sources-list";
      unique.forEach(({ title, url }) => {
        const a = document.createElement("a");
        a.href   = url;
        a.target = "_blank";
        a.rel    = "noopener noreferrer";
        a.textContent = title || url;
        list.appendChild(a);
      });
      details.appendChild(list);

      row.appendChild(details);
    }

    async function send(content) {
      // Show user bubble
      const userRow = addRow("user");
      addBubble(userRow, content);

      history.push({ role: "user", content });

      // Prepare agent row with status + empty streaming bubble
      const agentRow   = addRow("agent");
      const statusEl   = addStatus(agentRow);
      const bubble     = addBubble(agentRow, "");
      bubble.classList.add("cursor");

      sendBtn.disabled = true;
      input.disabled   = true;
      statusEl.textContent = "Thinking…";

      let fullText = "";
      let sources  = [];

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history }),
        });

        if (!res.ok || !res.body) throw new Error(`HTTP ${res.status}`);

        // Parse NDJSON from a ReadableStream line by line.
        const reader  = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buf += decoder.decode(value, { stream: true });
          const lines = buf.split("\n");
          buf = lines.pop() ?? "";    // keep partial last line in buffer

          for (const line of lines) {
            if (!line.trim()) continue;
            const event = JSON.parse(line);

            if (event.type === "status") {
              statusEl.textContent = event.message;
            } else if (event.type === "text") {
              fullText += event.text;
              bubble.textContent = fullText;
              messagesEl.scrollTop = messagesEl.scrollHeight;
            } else if (event.type === "sources") {
              sources = event.sources;
            } else if (event.type === "error") {
              bubble.textContent = `Error: ${event.message}`;
            }
          }
        }
      } catch (err) {
        bubble.textContent = `Error: ${err.message}`;
      }

      // Clean up after streaming finishes.
      // Switch from plain text (safe during partial streaming) to rendered
      // markdown now that we have the complete response.
      bubble.classList.remove("cursor");
      bubble.innerHTML = marked.parse(fullText);

      // Remove any image that fails to load (hotlink-protected, CORS-blocked,
      // CDN URLs that the browser can't reach, etc.).
      bubble.querySelectorAll("img").forEach(img => {
        img.onerror = () => img.remove();
      });

      statusEl.remove();
      addSources(agentRow, sources);
      messagesEl.scrollTop = messagesEl.scrollHeight;

      history.push({ role: "assistant", content: fullText });

      sendBtn.disabled = false;
      input.disabled   = false;
      input.focus();
    }

    // ── Voice input ──────────────────────────────────────────────────────
    const micBtn = document.getElementById("mic");
    let mediaRecorder = null;
    let audioChunks   = [];

    micBtn.addEventListener("click", async () => {
      // If already recording — stop and transcribe
      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        return;
      }

      // Request microphone
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch {
        input.placeholder = "Microphone access denied";
        setTimeout(() => (input.placeholder = "Ask anything…"), 3000);
        return;
      }

      audioChunks = [];

      // Pick the best supported MIME type explicitly — leaving it unset can
      // produce a format or codec Whisper struggles to decode reliably.
      const preferredMime = ["audio/webm;codecs=opus", "audio/ogg;codecs=opus", "audio/webm"]
        .find(t => MediaRecorder.isTypeSupported(t)) ?? "";
      mediaRecorder = new MediaRecorder(stream, preferredMime ? { mimeType: preferredMime } : {});

      // Timeslice of 250 ms: ondataavailable fires every quarter-second so
      // chunks accumulate even if the user stops quickly.
      mediaRecorder.ondataavailable = e => {
        if (e.data.size > 0) audioChunks.push(e.data);
      };

      mediaRecorder.onstop = async () => {
        // Stop all tracks so the browser mic indicator turns off
        stream.getTracks().forEach(t => t.stop());

        micBtn.textContent = "⏳";
        micBtn.disabled    = true;

        const blob     = new Blob(audioChunks, { type: mediaRecorder.mimeType || "audio/webm" });
        const mimeType = (mediaRecorder.mimeType || "audio/webm").split(";")[0];

        // Whisper hallucinates common words ("you", "Thank you.") when the
        // audio blob is too small — this catches accidental taps or silence.
        if (blob.size < 3000) {
          input.placeholder = "Recording too short — try again";
          setTimeout(() => (input.placeholder = "Ask anything…"), 2500);
          micBtn.textContent = "🎤";
          micBtn.disabled    = false;
          micBtn.classList.remove("recording");
          return;
        }

        try {
          const res = await fetch("/transcribe", {
            method:  "POST",
            headers: { "Content-Type": mimeType },
            body:    blob,
          });
          const { transcript, error } = await res.json();
          if (error) throw new Error(error);
          input.value = transcript;
          input.focus();
        } catch (err) {
          input.placeholder = `Transcription failed: ${err.message}`;
          setTimeout(() => (input.placeholder = "Ask anything…"), 4000);
        } finally {
          micBtn.textContent  = "🎤";
          micBtn.disabled     = false;
          micBtn.classList.remove("recording");
        }
      };

      mediaRecorder.start(250); // collect a chunk every 250 ms
      micBtn.classList.add("recording");
      micBtn.textContent = "⏹";
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const content = input.value.trim();
      if (!content) return;
      input.value = "";
      send(content);
    });
  </script>
</body>
</html>
